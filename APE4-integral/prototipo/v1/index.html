<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citas Médicas UTA - Prototipo v1</title>
<style>
:root{--azul:#1d4ed8;--fondo:#f4f6fb;--txt:#1f2937;--ok:#15803d;--err:#b91c1c;--gris:#6b7280}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--fondo);color:var(--txt);font-size:18px}
header{background:var(--azul);color:#fff;padding:14px 20px;font-weight:700}
main{max-width:560px;margin:20px auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px #0002}
h1{font-size:1.4rem;margin-top:0}
.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;background:#fff;color:#000;padding:8px;z-index:9}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:12px 18px;margin:6px 6px 6px 0;min-height:44px}
.p{background:var(--azul);color:#fff}.s{background:#e5e7eb;color:var(--txt)}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
label{display:block;margin-top:14px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:2px solid #9ca3af;border-radius:8px;margin-top:4px}
input[aria-invalid=true]{border-color:var(--err)}
.msg{color:var(--err);font-size:.9rem;min-height:1.2em}
.lista{list-style:none;padding:0}.lista li{margin:8px 0}
.lista button{width:100%;text-align:left;background:#eef2ff}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{margin:0;background:#eef2ff;border:2px solid transparent}
.slots button[aria-pressed=true]{border-color:var(--azul);background:#dbeafe}
.slots button:disabled{background:#e5e7eb;color:var(--gris);text-decoration:line-through;cursor:not-allowed}
.resumen{background:#f9fafb;border-radius:8px;padding:12px}
.ok{color:var(--ok)}.err{color:var(--err)}
.paso{color:var(--gris);font-size:.85rem}
.spin{width:36px;height:36px;border:5px solid #dbeafe;border-top-color:var(--azul);border-radius:50%;animation:g 1s linear infinite;margin:20px auto}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<a class="skip" href="#app">Saltar al contenido</a>
<header>Citas Médicas UTA</header>
<main id="app" tabindex="-1" aria-live="polite"></main>
<script>
/* CONFIG para la incidencia en vivo: cambiar aquí */
const CONFIG={
  horas:["08:00","08:30","09:00","10:30","11:00","15:00"],
  ocupadas:["09:00"],          // pantalla: no seleccionables
  falla1raVez:"10:30",         // simula que alguien la tomó justo antes
  especialidades:{"Medicina general":["Dra. Paredes","Dr. Salazar"],"Odontología":["Dra. Núñez"],"Psicología":["Dr. Mena"]}
};
const S={esp:"",med:"",fecha:"",hora:"",nombre:"",tel:"",motivo:"",intentos:0,citas:[]};
const $app=document.getElementById("app");
const fechas=[...Array(5)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i+1);return d.toISOString().slice(0,10)});

function pintar(html,titulo){
  $app.innerHTML=html;
  document.title=titulo+" - Citas Médicas UTA";
  $app.focus();
}
const paso=(n)=>`<p class="paso">Paso ${n} de 5</p>`;

function inicio(){
  pintar(`<h1>¿Qué desea hacer?</h1>
  <button class="p" id="b1">Agendar una cita</button>
  <button class="s" id="b2">Ver o cancelar mis citas</button>`,"Inicio");
  b1.onclick=especialidad; b2.onclick=misCitas;
}
function especialidad(){
  pintar(`${paso(1)}<h1>Elija especialidad y médico</h1>
  <ul class="lista">${Object.entries(CONFIG.especialidades).map(([e,ms])=>ms.map(m=>`<li><button data-e="${e}" data-m="${m}">${e}: ${m}</button></li>`).join("")).join("")}</ul>
  <button class="s" id="atras">Volver</button>`,"Especialidad");
  document.querySelectorAll(".lista button").forEach(b=>b.onclick=()=>{S.esp=b.dataset.e;S.med=b.dataset.m;horario()});
  atras.onclick=inicio;
}
function horario(){
  pintar(`${paso(2)}<h1>Fecha y hora con ${S.med}</h1>
  <label for="f">Fecha</label>
  <select id="f">${fechas.map(f=>`<option ${f===S.fecha?"selected":""}>${f}</option>`).join("")}</select>
  <p id="hl">Horas disponibles</p>
  <div class="slots" role="group" aria-labelledby="hl">${CONFIG.horas.map(h=>{const o=CONFIG.ocupadas.includes(h);return `<button data-h="${h}" aria-pressed="${S.hora===h}" ${o?"disabled":""}>${h}${o?" ocupada":""}</button>`}).join("")}</div>
  <p class="msg" id="m" role="alert"></p>
  <button class="s" id="atras">Volver</button><button class="p" id="sig">Continuar</button>`,"Horario");
  document.querySelectorAll(".slots button").forEach(b=>b.onclick=()=>{S.hora=b.dataset.h;document.querySelectorAll(".slots button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  atras.onclick=especialidad;
  sig.onclick=()=>{S.fecha=f.value;if(!S.hora){m.textContent="Elija una hora para continuar.";return}datos()};
}
function datos(){
  pintar(`${paso(3)}<h1>Sus datos</h1>
  <label for="n">Nombre completo</label><input id="n" value="${S.nombre}" autocomplete="name"><p class="msg" id="en" role="alert"></p>
  <label for="t">Teléfono de 10 dígitos</label><input id="t" inputmode="numeric" value="${S.tel}" autocomplete="tel"><p class="msg" id="et" role="alert"></p>
  <label for="mo">Motivo de la consulta, opcional</label><textarea id="mo" rows="3">${S.motivo}</textarea>
  <button class="s" id="atras">Volver</button><button class="p" id="sig">Revisar cita</button>`,"Datos");
  atras.onclick=horario;
  sig.onclick=()=>{
    S.nombre=n.value.trim();S.tel=t.value.trim();S.motivo=mo.value.trim();
    en.textContent="";et.textContent="";n.removeAttribute("aria-invalid");t.removeAttribute("aria-invalid");
    let bad=null;
    if(S.nombre.length<5){en.textContent="Escriba su nombre y apellido.";n.setAttribute("aria-invalid",true);bad=n}
    if(!/^\d{10}$/.test(S.tel)){et.textContent="El teléfono debe tener 10 números, sin espacios.";t.setAttribute("aria-invalid",true);bad=bad||t}
    if(bad){bad.focus();return}
    revisar();
  };
}
function revisar(){
  pintar(`${paso(4)}<h1>Revise su cita</h1>
  <div class="resumen"><p><b>Especialidad:</b> ${S.esp}</p><p><b>Médico:</b> ${S.med}</p><p><b>Fecha:</b> ${S.fecha}</p><p><b>Hora:</b> ${S.hora}</p><p><b>Paciente:</b> ${S.nombre}</p><p><b>Teléfono:</b> ${S.tel}</p></div>
  <button class="s" id="atras">Modificar datos</button><button class="p" id="conf">Confirmar cita</button>`,"Revisar");
  atras.onclick=datos; conf.onclick=guardar;
}
function guardar(){
  pintar(`${paso(5)}<h1>Guardando su cita</h1><div class="spin" role="status" aria-label="Cargando"></div><p>Un momento, estamos reservando el horario.</p>`,"Guardando");
  S.intentos++;
  setTimeout(()=>{
    if(S.hora===CONFIG.falla1raVez&&S.intentos===1) return errorHorario();
    exito();
  },1500);
}
function errorHorario(){
  pintar(`<h1 class="err">No pudimos reservar las ${S.hora}</h1>
  <p role="alert">Otra persona tomó ese horario hace un momento. Sus datos siguen guardados, solo elija otra hora.</p>
  <button class="p" id="otra">Elegir otro horario</button><button class="s" id="reint">Reintentar el mismo</button>`,"Error");
  otra.onclick=()=>{CONFIG.ocupadas.push(S.hora);S.hora="";horario()};
  reint.onclick=guardar;
}
function exito(){
  const id="CM-"+String(S.citas.length+1).padStart(3,"0");
  S.citas.push({id,esp:S.esp,med:S.med,fecha:S.fecha,hora:S.hora});
  pintar(`<h1 class="ok">Cita confirmada</h1>
  <div class="resumen"><p>Código: <b>${id}</b></p><p>${S.esp} con ${S.med}</p><p>${S.fecha} a las ${S.hora}</p></div>
  <button class="p" id="fin">Volver al inicio</button><button class="s" id="mc">Ver mis citas</button>`,"Cita confirmada");
  S.hora="";S.intentos=0;
  fin.onclick=inicio; mc.onclick=misCitas;
}
function misCitas(){
  pintar(`<h1>Mis citas</h1>${S.citas.length?`<ul class="lista">${S.citas.map((c,i)=>`<li class="resumen">${c.id}: ${c.esp}, ${c.med}, ${c.fecha} ${c.hora}<br><button class="s" data-i="${i}">Cancelar cita</button></li>`).join("")}</ul>`:"<p>No tiene citas agendadas.</p>"}
  <p class="msg" id="m" role="status"></p><button class="s" id="atras">Volver</button>`,"Mis citas");
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>confirmarCancel(+b.dataset.i));
  atras.onclick=inicio;
}
function confirmarCancel(i){
  const c=S.citas[i];
  pintar(`<h1>¿Cancelar la cita ${c.id}?</h1><p>${c.fecha} a las ${c.hora} con ${c.med}.</p>
  <button class="s" id="no">No, conservar</button><button class="p" id="si">Sí, cancelar</button>`,"Cancelar");
  no.onclick=misCitas;
  si.onclick=()=>{S.citas.splice(i,1);misCitas();document.getElementById("m").textContent="La cita fue cancelada."};
}
inicio();
</script>
</body>
</html>
